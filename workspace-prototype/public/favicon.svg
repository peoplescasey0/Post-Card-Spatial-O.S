    </filter>
  </defs>
  <rect x="6" y="6" width="52" height="52" rx="10" fill="url(#plate)" stroke="#323640" stroke-width="0.8" />
  <rect x="16" y="16" width="32" height="32" rx="5" fill="url(#core)" stroke="#262A33" stroke-width="0.6" />
  <g filter="url(#glow)">
    <line x1="16" y1="32" x2="39" y2="32" stroke="#F59E0B" stroke-width="2.2" />
    <rect x="38" y="29.5" width="5" height="5" rx="0.8" fill="#FDE047" stroke="#F59E0B" stroke-width="0.4" />
  </g>
</svg>
